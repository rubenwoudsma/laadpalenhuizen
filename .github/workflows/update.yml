name: Update charging point data

on:
  push:
    paths:
      - "process.py"
      - "app.js"
      - "index.html"
      - "pricing-sources.json"
      - "tests/test_frontend_contract.py"
      - "tests/test_pricing.py"
      - "tests/test_pricing_monitor.py"
      - "tests/test_quality_report.py"
      - "scripts/check_pricing_sources.py"
      - "scripts/generate_quality_report.py"
      - ".github/workflows/update.yml"
  schedule:
    # Run daily at 06:37 UTC. In the Netherlands this is 07:37 or 08:37 local time depending on DST.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-charging-point-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run regression tests
        run: |
          python3 -m unittest discover -s tests
          python3 -m py_compile process.py scripts/check_pricing_sources.py scripts/generate_quality_report.py
          node --check app.js

      - name: Verify pricing rules for this run
        run: |
          python3 scripts/check_pricing_sources.py \
            --report pricing-monitor-daily.md \
            --json-status pricing-source-status.json \
            --allow-failures
          cat pricing-monitor-daily.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run preprocessor
        run: python3 process.py

      - name: Build pricing quality report
        run: python3 scripts/generate_quality_report.py --github-summary

      - name: Check if data changed
        id: diff
        run: |
          if [[ -z "$(git status --porcelain -- huizen-data.json pricing-quality.json)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in data, skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add huizen-data.json pricing-quality.json
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data: NDW update ${TIMESTAMP}"
          git push
